services:
  app:
    build: .
    container_name: mallboard-app
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      # Aligned with the live sample deployment (locally fixed to 18080 so
      # the public route stays stable); deploys must not flip this back.
      - "127.0.0.1:18080:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env}
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DEMO_MODE: ${DEMO_MODE:-false}
      PUBLIC_SAMPLE_MODE: ${PUBLIC_SAMPLE_MODE:-false}
      SAMPLE_RESET_TOKEN: ${SAMPLE_RESET_TOKEN:-}
      SAMPLE_GUEST_EMPLOYEE_CODE: ${SAMPLE_GUEST_EMPLOYEE_CODE:-EX-01}
      REFERRAL_STORAGE_DIR: /app/private_storage/referral-documents
      DEPLOYMENT_PROFILE: ${DEPLOYMENT_PROFILE:-}
      DEPLOYMENT_ID: ${DEPLOYMENT_ID:-}
      DEPLOYMENT_TENANT_ID: ${DEPLOYMENT_TENANT_ID:-}
      DEPLOYMENT_NAME: ${DEPLOYMENT_NAME:-}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      INITIAL_ADMIN_EMPLOYEE_CODE: ${INITIAL_ADMIN_EMPLOYEE_CODE:-}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-}
      INITIAL_ADMIN_PASSWORD_FILE: ${INITIAL_ADMIN_PASSWORD_FILE:-}
      ATTACHMENT_STORAGE_DIR: /app/attachments
      BACKUP_DIR: /app/backups
      OPS_STATUS_TOKEN: ${OPS_STATUS_TOKEN:-}
      BUILD_REVISION: ${BUILD_REVISION:-}
      APP_VERSION: ${APP_VERSION:-3.1.0}
      MAINTENANCE_FLAG_FILE: /app/run/maintenance.flag
      BACKUP_STATUS_FILE: /app/backups/status/last-success.json
      LEGACY_MIGRATION_AUTHORIZED: ${LEGACY_MIGRATION_AUTHORIZED:-}
      MONITOR_WEBHOOK_URL: ${MONITOR_WEBHOOK_URL:-}
    volumes:
      - referral-documents:/app/private_storage/referral-documents
      # M-09 persistent wiring: the env paths above only work because these
      # host bind mounts exist. The deployment directory itself is mounted
      # at /deploy so the app reads the SAME maintenance flag file that
      # deploy.sh/backup.sh write on the host ($TARGET/.maintenance.flag),
      # the backup status directory written by backup.sh, the attachment
      # root and the initial-admin password file directory.
      - ./run:/app/run
      - ./attachments:/app/attachments
      - ./backups:/app/backups
      - ./secrets:/app/secrets:ro

  mysql:
    image: mysql:8.0
    container_name: mallboard-mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME:?Set DB_NAME in .env}
      MYSQL_USER: ${DB_USER:?Set DB_USER in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  mysql-data:
  referral-documents:
